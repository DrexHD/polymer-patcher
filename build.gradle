plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
    maven { url 'https://maven.nucleoid.xyz/releases' }
    maven { url 'https://maven.terraformersmc.com/' }
    maven {
        url "https://maven.theepicblock.nl"
        content { includeGroup("nl.theepicblock") }
    }
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    implementation include("eu.pb4:factorytools:${project.factorytools_version}")
    implementation include("nl.theepicblock:resource-locator-api:${project.resource_locator_version}")

    implementation "eu.pb4:polymer-core:${project.polymer_version}"
    implementation("eu.pb4:polymer-blocks:${project.polymer_version}")
    implementation "eu.pb4:polymer-resource-pack:${project.polymer_version}"
    implementation("eu.pb4:polymer-sound-patcher:${project.polymer_version}")
    implementation "eu.pb4:polymer-resource-pack-extras:${project.polymer_version}"
    implementation("eu.pb4:polymer-autohost:${project.polymer_version}")
    implementation "eu.pb4:polymer-virtual-entity:${project.polymer_version}"

	implementation project(path: ":client-dump")
	include project(":client-dump")
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

loom {
    accessWidenerPath = file("src/main/resources/polymer-patcher.classtweaker")
}

configurations.runtimeClasspath {
	exclude group: 'net.fabricmc.fabric-api', module: 'fabric-gametest-api-v1'
}

afterEvaluate {
	loom.runs.configureEach {
		// https://fabricmc.net/wiki/tutorial:mixin_hotswaps
//		jvmArguments.add("-javaagent:${ configurations.compileClasspath.get().find { it.name.contains("sponge-mixin") } }")
		jvmArguments.add("-XX:+UnlockDiagnosticVMOptions")
		jvmArguments.add("-XX:+DebugNonSafepoints")
//		jvmArguments.add("-Dmixin.debug.export=true")
//		jvmArguments.add("-Dmixin.debug=true")
		jvmArguments.add("-Dfabric.disableEnvironmentStrip=1")
	}
}

tasks.register("runProductionServer", net.fabricmc.loom.task.prod.ServerProductionRunTask) {
	jvmArgs.add("-Dfabric.disableEnvironmentStrip=1")
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
